{{define "title"}}Meine Liste – StreamFlix{{end}}
{{define "content"}}
<div class="container" style="padding-top:1.5rem">
  <h1>Meine Liste</h1>
  <div class="media-grid" style="padding:0">
    {{range .Items}}{{if .Media}}{{template "media-card" .Media}}{{end}}{{end}}
  </div>
  {{if not .Items}}<p class="card-meta">Deine Merkliste ist noch leer.</p>{{end}}
</div>
{{end}}
