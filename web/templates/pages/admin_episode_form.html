{{define "title"}}Episode bearbeiten – Admin{{end}}
{{define "content"}}
<div class="admin-shell">
{{template "admin-sidebar" .}}
<div class="admin-main">
  <p><a href="/admin/seasons/{{.Episode.SeasonID}}" style="color:var(--accent)">&larr; Zur Staffel</a></p>
  <h1>Episode bearbeiten</h1>
  <form action="/admin/episodes/{{.Episode.ID}}" method="post" style="max-width:520px">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <div class="field">
      <label for="episodeNumber">Episodennummer</label>
      <input type="number" id="episodeNumber" name="episodeNumber" required min="1" value="{{.Episode.EpisodeNumber}}">
    </div>
    <div class="field">
      <label for="title">Titel</label>
      <input type="text" id="title" name="title" required value="{{.Episode.Title}}">
    </div>
    <div class="field">
      <label for="description">Beschreibung</label>
      <textarea id="description" name="description" required minlength="10" rows="3">{{.Episode.Description}}</textarea>
    </div>
    <div class="field">
      <label for="duration">Dauer in Minuten</label>
      <input type="number" id="duration" name="duration" required min="1" value="{{.Episode.Duration}}">
    </div>
    <div class="field">
      <label for="videoUrl">Video-URL</label>
      <input type="url" id="videoUrl" name="videoUrl" required value="{{.Episode.VideoURL}}">
    </div>
    <div class="field">
      <label for="thumbnailUrl">Thumbnail-URL</label>
      <input type="url" id="thumbnailUrl" name="thumbnailUrl" required value="{{.Episode.ThumbnailURL}}">
    </div>
    <div class="field field-checkbox">
      <input type="checkbox" id="isPublished" name="isPublished" {{if .Episode.IsPublished}}checked{{end}}>
      <label for="isPublished" style="margin:0">Veröffentlicht</label>
    </div>
    <button type="submit" class="btn btn-primary">Speichern</button>
  </form>
</div>
</div>
{{end}}
