{{define "title"}}Einloggen – StreamFlix{{end}}
{{define "content"}}
<div class="form-card">
  <h1>Einloggen</h1>
  <form action="/api/auth/login" method="post">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <div class="field">
      <label for="email">E-Mail</label>
      <input type="email" id="email" name="email" required autocomplete="email">
    </div>
    <div class="field">
      <label for="password">Passwort</label>
      <input type="password" id="password" name="password" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn btn-primary" style="width:100%">Einloggen</button>
  </form>
  <p style="margin-top:1rem;font-size:.9rem;color:#a1a1aa">Noch kein Konto? <a href="/register" style="color:#dc2626">Jetzt registrieren</a></p>
</div>
{{end}}
